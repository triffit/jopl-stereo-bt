[workspace]
resolver = "3"
members = [
    "crates/stereo-bt-core",
    "crates/stereo-bt-engine",
    "crates/stereo-bt-wasapi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["JOPL", "Triffit"]
publish = false

[workspace.dependencies]
stereo-bt-core = { path = "crates/stereo-bt-core" }
stereo-bt-wasapi = { path = "crates/stereo-bt-wasapi" }
rtrb = "0.4"
thiserror = "2"
wasapi = "0.25"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
