[workspace]
resolver = "3"
members = [
    "crates/stereo-bt-app",
    "crates/stereo-bt-core",
    "crates/stereo-bt-engine",
    "crates/stereo-bt-wasapi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["JOPL", "Triffit"]
publish = false

[workspace.dependencies]
stereo-bt-core = { path = "crates/stereo-bt-core" }
stereo-bt-engine = { path = "crates/stereo-bt-engine" }
stereo-bt-wasapi = { path = "crates/stereo-bt-wasapi" }
anyhow = "1"
rtrb = "0.4"
slint = { version = "~1.18", features = ["unstable-winit-030"] }
slint-build = "1.18"
winresource = "0.1"
thiserror = "2"
wasapi = "0.25"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
tray-icon = "0.26"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
